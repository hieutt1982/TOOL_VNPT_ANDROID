<title>OneLink - Cấu hình Modem</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
header{background:#0f172a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
header h1{font-size:20px;margin:0 0 4px} header small{opacity:.75}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000010}
.hidden{display:none!important}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input,select,button{width:100%;min-height:46px;border:1px solid #d7deea;border-radius:11px;padding:10px 12px;font-size:16px;background:#fff}
button{border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}
button.secondary{background:#e8eef8;color:#172033}
button.danger{background:#dc2626}
button.success{background:#15803d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-btn{min-height:72px;text-align:left;background:#fff;color:#172033;border:1px solid #dbe3ef;box-shadow:0 2px 8px #00000008}
.menu-btn b{display:block;font-size:16px}.menu-btn span{font-size:12px;color:#68758a}
h2{font-size:18px;margin:0 0 12px}.sub{display:flex;gap:8px;margin-bottom:12px}.sub button{flex:1}
.back{background:#e8eef8;color:#172033}
.status{padding:10px 12px;border-radius:10px;background:#eef3f9;margin-bottom:12px;font-size:14px}
.status.ok{background:#eaf8ef;color:#166534}.status.err{background:#fff0f0;color:#991b1b}
.item{border:1px solid #e1e7f0;border-radius:13px;padding:13px;margin:9px 0;background:#fbfcfe}
.item h3{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed #e7ebf2;font-size:14px}
.row:last-child{border-bottom:0}.row span:first-child{color:#667085}.row span:last-child{text-align:right;font-weight:600;word-break:break-word}
.section-title{font-size:13px;font-weight:800;color:#526070;text-transform:uppercase;margin:15px 0 6px}
details{border:1px solid #e1e7f0;border-radius:12px;margin:9px 0;background:#fff}summary{padding:12px;font-weight:800;cursor:pointer}
details .inside{padding:0 12px 12px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;z-index:30;display:none}
.progress-box{display:none;margin:0 0 12px;padding:13px;border:2px solid #2563eb;border-radius:12px;background:#eff6ff}
.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;margin-bottom:8px}
.progress-track{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:#2563eb;border-radius:99px;transition:width .25s ease;position:relative;overflow:hidden}
.progress-log{margin-top:8px;font-size:12px;color:#334155;max-height:110px;overflow:auto;white-space:pre-wrap}
@media(max-width:520px){.menu-grid,.grid{grid-template-columns:1fr}.sub{flex-direction:column}header{padding-top:calc(14px + env(safe-area-inset-top))}}

.feature-progress{display:none;margin:10px 0;padding:10px;border:1.5px solid #2563eb;border-radius:10px;background:#eff6ff}
.feature-progress .fp-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;margin-bottom:7px}
.feature-progress .fp-track{height:7px;background:#dbeafe;border-radius:99px;overflow:hidden}
.feature-progress .fp-bar{height:100%;width:0%;background:#2563eb;border-radius:99px;transition:width .25s ease}
.feature-progress .fp-log{margin-top:7px;font-size:11px;color:#334155;white-space:pre-wrap;max-height:90px;overflow:auto}

</style>

<style id="viewport-fit-final">
/* ===== FINAL VIEWPORT FIT =====
   Chỉ chỉnh kích thước/bố cục giao diện.
   Không thay đổi API hoặc JavaScript.
*/
html,body{
  width:100%;
  max-width:100%;
  min-width:0;
  margin:0;
  padding:0;
  overflow-x:hidden !important;
}

body{
  min-height:100dvh;
}

header{
  width:100%;
  position:sticky;
  top:0;
  z-index:10;
}

main{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:12px;
  box-sizing:border-box;
}

.card{
  width:100%;
  box-sizing:border-box;
}

#login,#home,#section{
  width:100%;
  box-sizing:border-box;
}

.menu-grid{
  width:100%;
  grid-template-columns:1fr !important;
  gap:8px;
}

.menu-btn{
  width:100%;
  min-width:0;
  min-height:72px !important;
  box-sizing:border-box;
}

.menu-btn b,
.menu-btn span{
  overflow-wrap:anywhere;
  word-break:break-word;
}

.sub{
  width:100%;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.sub .back{
  grid-column:1 / -1;
}

#panel,
#panel > *,
#panel input,
#panel select,
#panel textarea,
#panel button{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}

.row{
  min-width:0;
}

.row span:last-child{
  min-width:0;
  max-width:58%;
  overflow-wrap:anywhere;
  word-break:break-word;
}

pre{
  max-width:100%;
  overflow-x:auto;
  box-sizing:border-box;
}

/* Desktop */
@media(min-width:761px){
  main{
    padding:14px;
  }
}

/* Điện thoại */
@media(max-width:600px){
  main{
    width:100%;
    max-width:none;
    padding:8px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }

  header{
    position:sticky;
    top:0;
  }

  .card{
    border-radius:14px;
    padding:12px;
    margin-bottom:8px;
  }

  .menu-grid{
    gap:8px;
  }

  .menu-btn{
    min-height:72px !important;
    padding:11px 12px !important;
  }

  .sub{
    grid-template-columns:1fr 1fr;
  }

  .sub button{
    min-height:48px !important;
  }

  input,select,textarea,button{
    width:100%;
    max-width:100%;
  }
}

/* Điện thoại rất nhỏ */
@media(max-width:380px){
  main{
    padding:6px;
  }

  .menu-btn{
    min-height:68px !important;
    padding:9px 10px !important;
  }

  .sub{
    gap:6px;
  }
}
</style>

const API_1 = "/api/auth/step1";
const API_2 = "/api/auth/step2";
const NGHIEM_THU_URL = "/api/thicong/nghiemThuMayHong";
const DEVICE_ID = "54524c30658290a7";
const MOBILE_ID = "";
const MENU_ID = 11250;

function setAuthStatus(msg) {
  document.getElementById("authStatus").textContent = msg;
}

function showResult(obj) {
  document.getElementById("authResult").textContent =
    typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
}

function saveToken(data) {
  localStorage.setItem(TOKEN_KEY, JSON.stringify(data));
}

function loadToken() {
  try {
    const raw = localStorage.getItem(TOKEN_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function getValidToken() {
  const t = loadToken();
  if (!t || !t.access_token) return null;
  if (t.expires_at && Date.now() / 1000 >= Number(t.expires_at)) {
    localStorage.removeItem(TOKEN_KEY);
    return null;
  }
  return t;
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById("logoutBtn").classList.add("hidden");
  window.pendingLogin = null;
  document.getElementById("authCard").classList.remove("hidden");
  document.getElementById("authOtpBox").classList.add("hidden");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("home").classList.add("hidden");
  document.getElementById("section").classList.add("hidden");
  setAuthStatus("Đã xóa token. Vui lòng đăng nhập lại.");
  showResult("Chưa có dữ liệu.");
}

function updateLoginUI() {
  const token = getValidToken();
  const loginCard = document.getElementById("authCard");
  if (token) {
    loginCard.classList.add("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");
    const name = token.ten_nv || token.username || "người dùng";
    setAuthStatus("✅ Đang đăng nhập: " + name + "\nToken còn hiệu lực.");
    document.getElementById("login").classList.remove("hidden");
  } else {
    loginCard.classList.remove("hidden");
    document.getElementById("login").classList.add("hidden");
  }
}

window.addEventListener("DOMContentLoaded", updateLoginUI);

async function postJson(url, data, headers={}) {
  const response = await fetch(url, {
    method: "POST",
    headers: Object.assign({
      "Content-Type": "application/json"
    }, headers),
    body: JSON.stringify(data)
  });
  let body;
  const text = await response.text();
  try { body = JSON.parse(text); } catch { body = text; }
  if (!response.ok) {
    const err = new Error("HTTP " + response.status);
    err.status = response.status;
    err.body = body;
    throw err;
  }
  return body;
}

async function postForm(url, data, headers={}) {
  const form = new URLSearchParams();
  for (const [key, value] of Object.entries(data)) {
    form.append(key, value == null ? "" : String(value));
  }
  const response = await fetch(url, {
    method: "POST",
    headers: Object.assign({
      "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
    }, headers),
    body: form.toString()
  });
  const text = await response.text();
  let body;
  try { body = JSON.parse(text); } catch { body = text; }
  if (!response.ok) {
    const err = new Error("HTTP " + response.status);
    err.status = response.status;
    err.body = body;
    throw err;
  }
  return body;
}

async function loginStep1() {
  // A new attempt must not be able to submit an OTP against an older secretCode.
  window.pendingLogin = null;
  document.getElementById("authOtpBox").classList.add("hidden");
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    setAuthStatus("❌ Vui lòng nhập username và password.");
    return;
  }

  setAuthStatus("⏳ [1] Đang xác thực tài khoản...");

  const payload = {
    username,
    password,
    os_type: "1",
    mobile_id: MOBILE_ID,
    device_id: DEVICE_ID
  };

  try {
    const data1 = await postJson(API_1, payload, {
      "User-Agent": "Dart/3.10 (dart:io)"
    });

    showResult(data1);

    if (data1.error !== null && data1.error !== undefined) {
      setAuthStatus("❌ API 1 thất bại.\n" + JSON.stringify(data1, null, 2));
      return;
    }

    const data = data1.data || {};
    const secretCode = data.secretCode;

    if (!secretCode) {
      setAuthStatus("❌ Không nhận được secretCode.");
      return;
    }

    // Chỉ giữ secretCode tạm thời trong JS, không lưu mật khẩu.
    window.pendingLogin = {
      username,
      secretCode,
      ten_nv: data.ten_nv || null,
      sdt: data.sdt || null
    };

    document.getElementById("authOtpBox").classList.remove("hidden");
    setAuthStatus(
      "✅ API 1 thành công.\n" +
      "Tên nhân viên: " + (data.ten_nv || "") + "\n" +
      "Số điện thoại: " + (data.sdt || "") + "\n\n" +
      "OTP đã được gửi. Nhập OTP để tiếp tục."
    );
  } catch (e) {
    setAuthStatus("❌ Lỗi API 1:\n" + (e.body ? JSON.stringify(e.body, null, 2) : e.message));
  }
}

async function loginStep2() {
  if (!window.pendingLogin) {
    setAuthStatus("❌ Chưa thực hiện bước 1.");
    return;
  }

  const otp = document.getElementById("otp").value.trim();
  if (!otp) {
    setAuthStatus("❌ OTP không được để trống.");
    return;
  }

  setAuthStatus("⏳ [2] Đang xác thực OTP...");

  const p = window.pendingLogin;
  const payload = {
    grant_type: "password",
    client_id: "clientapp",
    client_secret: "password",
    secretCode: p.secretCode,
    otp
  };

  try {
    // OAuth token endpoints accept form-encoded grant parameters, not JSON.
    const data2 = await postForm(API_2, payload, {
      "User-Agent": "Dart/3.10 (dart:io)"
    });

    showResult(data2);

    const access_token = data2.access_token;
    if (!access_token) {
      setAuthStatus("❌ Không nhận được access_token.");
      return;
    }

    const expires_in = Number(data2.expires_in || 0);
    const tokenData = {
      username: p.username,
      ten_nv: p.ten_nv,
      sdt: p.sdt,
      os_type: "1",
      device_id: DEVICE_ID,
      mobile_id: MOBILE_ID,
      secretCode: p.secretCode,
      access_token,
      refresh_token: data2.refresh_token || null,
      token_type: data2.token_type || null,
      expires_in: data2.expires_in || null,
      expires_at: expires_in ? Date.now() / 1000 + expires_in : null,
      scope: data2.scope || null
    };

    saveToken(tokenData);
    fetch('/api/log-login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app:'MODEM',username:p.username})
    }).catch(()=>{});

    window.pendingLogin = null;

    setAuthStatus(
      "✅ ĐĂNG NHẬP THÀNH CÔNG.\n" +
      "Token đã được lưu trong localStorage với key: " + TOKEN_KEY
    );
    showResult(tokenData);
    document.getElementById("authCard").classList.add("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");
    document.getElementById("login").classList.remove("hidden");
  } catch (e) {
    setAuthStatus("❌ OTP không hợp lệ hoặc login thất bại.\n" +
      (e.body ? JSON.stringify(e.body, null, 2) : e.message));
  }
}

function ensureFeatureProgress(){

  if(!box){
    box=document.createElement('div');
    box.id='featureProgress';
    box.className='feature-progress';

async function paint(){
  await new Promise(resolve=>requestAnimationFrame(()=>resolve()));
}

let actionBusy=false;
function beginAction(){
  if(actionBusy){toast('⏳ Đang có thao tác khác, vui lòng chờ...',false);return false}
  actionBusy=true;
  return true;
}
function endAction(){actionBusy=false}
function numField(id,label,min=0){
  const el=$(id);
  const n=Number(el?.value);
  if(!Number.isFinite(n)||n<min) throw new Error(`${label} không hợp lệ.`);
  return n;
}

function progressStart(text='Đang xử lý...'){
  const box=ensureFeatureProgress();
  box.style.display='block';
  $('fpBar').style.background='#2563eb';
  $('fpText').textContent='⏳ '+text;
  $('fpPercent').textContent='0%';
  $('fpBar').style.width='0%';
  $('fpLog').textContent='';
}

function progressStep(text,percent){
  const box=ensureFeatureProgress();
  box.style.display='block';
  $('fpText').textContent='⏳ '+text;
  $('fpPercent').textContent=Math.max(0,Math.min(100,percent))+'%';
  $('fpBar').style.width=Math.max(0,Math.min(100,percent))+'%';
  const log=$('fpLog');
  log.textContent+=(log.textContent?'\n':'')+'• '+text;
  log.scrollTop=log.scrollHeight;
}

function progressDone(text='Hoàn tất'){
  progressStep('✓ '+text,100);
}

function progressError(text){
  const box=ensureFeatureProgress();
  box.style.display='block';
  $('fpText').textContent='✗ '+text;
  $('fpPercent').textContent='LỖI';
  $('fpBar').style.width='100%';
  $('fpBar').style.background='#dc2626';
  const log=$('fpLog');
  log.textContent+=(log.textContent?'\n':'')+'• ✗ '+text;
}

/* ============================================================
   API THI CÔNG - TRA CỨU SERIAL VẬT TƯ
   Luồng: Username/Password -> OTP -> access_token -> API này.
   KHÔNG liên quan đến MODEM_API/getDeviceInfo.
   ============================================================ */
const THICONG_API='/api/thicong/dsVatTuThiCong';
const THICONG_MENU_ID='11226';

// app-secret theo cách app OneBSS tạo từ token + thông tin trình duyệt.
// Không dùng app-secret HAR cố định vì dễ hết hiệu lực/không khớp thiết bị.
function buildThicongAppSecret(token){
  const data={
    device_id: token?.device_id || DEVICE_ID,
    device_ip:'',
    device_name:navigator.userAgent || '',
    mac_address:'',
    mobile_id:token?.mobile_id || MOBILE_ID,
    app_id:APP_ID,
    app_version:APP_VERSION,
    os_version:navigator.platform || ''
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

async function traCuuSerialVatTu(serialNumber){
  const tokenData=getValidToken();
  const accessToken=tokenData && tokenData.access_token;
  if(!accessToken){
    throw new Error('Chưa đăng nhập OneBSS hoặc access_token đã hết hạn.');
  }

  const url=THICONG_API+'?serial='+encodeURIComponent(serialNumber);
  const response=await fetch(url,{
    method:'POST',
    headers:{
      'accept':'application/json',
      'content-type':'application/json',
      'authorization':'Bearer '+accessToken,
      'selectedmenuid':THICONG_MENU_ID,
      'app-secret':buildThicongAppSecret(tokenData)
    },
    body:'{"menu_id":11226}'
  });

  const text=await response.text();
  let data;
  try{ data=JSON.parse(text); }
  catch(e){ data={message:text}; }

  if(!response.ok){
    const detail=data?.message || data?.error || text || ('HTTP '+response.status);
    throw new Error('HTTP '+response.status+' — '+detail);
  }

  if(data?.error && data.error!=='BSS-00000000'){
    throw new Error(data.message || data.error || 'API Thi Công báo lỗi');
  }

  const first=Array.isArray(data?.data) ? data.data[0] : null;
  const vt=first?.vatTuThiCong;

  return {
    serialVatTu:vt?.serial || '',
    maVatTu:vt?.maVatTu || '',
    tenVatTu:vt?.tenVatTu || '',
    partNumber:vt?.partNumber || '',
    data
  };
}

const MODEM_TOKEN_ID='SDK_TECH';

function modemHeaders(){
  return {
    'accept':'application/json',
    'content-type':'application/json',
    'token-key':MODEM_TOKEN_KEY,
    'token-id':MODEM_TOKEN_ID
  };
}

async function apiGet(path,params={}){
 const label=(params.command||path.split('/').pop()||'API');
 progressStart(`Đang gọi ${label}...`);
 progressStep(`Đang gửi GET ${path} trực tiếp...`,20);
 await paint();
 const q=Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k]==null?'':params[k])).join('&');
 const url=MODEM_API+'/'+String(path||'').replace(/^\/+/, '')+(q?'?'+q:'');
 try{
   const r=await fetch(url,{method:'GET',headers:modemHeaders()});
   const text=await r.text();
   let data;
   try{data=JSON.parse(text)}catch(e){data={errorMessage:text}}
   progressStep(`API ${label} đã phản hồi...`,75);
   if(!r.ok || (data.errorCode!==undefined && Number(data.errorCode)!==200)){
     throw new Error(data.errorMessage||('HTTP '+r.status));
   }
   progressStep(`Đã nhận dữ liệu ${label}.`,90);
   return data;
 }catch(e){
   throw new Error(e&&e.message?e.message:String(e));
 }
}

async function apiPost(payload){
 const command=payload?.command||'API POST';
 progressStart(`Đang gọi ${command}...`);
 progressStep(`Đang chuẩn bị payload ${command}...`,15);
 await paint();
 try{
   const r=await fetch(MODEM_API+'/deviceConfig',{
     method:'POST',
     headers:modemHeaders(),
     body:JSON.stringify(payload||{})
   });
   const text=await r.text();
   let data;
   try{data=JSON.parse(text)}catch(e){data={errorMessage:text}}
   progressStep(`API ${command} đã phản hồi...`,80);
   if(!r.ok || (data.errorCode!==undefined && Number(data.errorCode)!==200)){
     throw new Error(data.errorMessage||('HTTP '+r.status));
   }
   progressStep(`Đã nhận kết quả ${command}.`,92);
   return data;
 }catch(e){
   throw new Error(e&&e.message?e.message:String(e));
 }
}

function parseSerialInput(value){
  return [
    ...new Set(
      String(value || '')
        .split(';')
        .map(function(x){ return x.trim(); })
        .filter(Boolean)
    )
  ];
}

/*
 * Một ô nhập duy nhất:
 * - 1 Serial              -> kết nối modem -> vào MENU CẤU HÌNH MODEM
 * - nhiều Serial có dấu ; -> tra cứu menID + PPPoE
 */
async function handleSerialInput(){
  const value=$('serial')?.value || '';
  const serials=parseSerialInput(value);

  if(!serials.length){
    toast('Nhập Serial Number',false);
    return;
  }

  if(serials.length===1){
    $('serial').value=serials[0];
    await connectDevice();
    return;
  }

  if(serials.length>50){
    toast('Tối đa 50 Serial mỗi lần',false);
    return;
  }

  await getBulkDeviceInfo(serials);
}

  const total=rows.length;
  const materialSuccess=rows.filter(function(x){return x.materialOk}).length;
  const modemSuccess=rows.filter(function(x){return x.modemOk}).length;
  const fail=rows.filter(function(x){return !x.modemOk || !x.materialOk}).length;

  summary.innerHTML=
    '<div class="bulk-summary">' +
    'Tổng <b>'+total+'</b> Serial | ' +
    'Modem <b>'+modemSuccess+'</b> | ' +
    'Vật tư <b>'+materialSuccess+'</b> | ' +
    'Có lỗi <b>'+fail+'</b>' +
    '</div>';

  let html=
    '<div class="bulk-table-wrap">' +
    '<table class="bulk-table">' +
    '<thead><tr>' +
    '<th>#</th>' +
    '<th>Serial / Serial Vật tư</th>' +
    '<th>MenID / PPPoE</th>' +
    '<th>Tên vật tư</th>' +
    '<th>Trạng thái</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(row,index){
    const status=[];
    if(row.modemOk) status.push('✓ Modem');
    else status.push('✗ Modem: '+(row.modemError||'lỗi'));
    if(row.materialOk) status.push('✓ Vật tư');
    else status.push('✗ Vật tư: '+(row.materialError||'lỗi'));

    html +=
      '<tr>' +
      '<td>'+(index+1)+'</td>' +
      '<td>'+
        esc(row.serial || '')+
        (row.materialOk && row.serialVatTu ? '<br><b>'+esc(row.serialVatTu)+'</b>' : '')+
      '</td>' +
      '<td>'+
        (row.modemOk
          ? esc(row.menID || 'Không tìm thấy')+'<br><b>'+esc(row.pppoeUsername || 'Không tìm thấy')+'</b>'
          : '—')+
      '</td>' +
      '<td>'+
        (row.materialOk
          ? esc(String(row.tenVatTu || '').replace(/^Thiết bị đầu cuối\s*/i,''))
          : '—')+
      '</td>' +
      '<td class="'+(row.modemOk && row.materialOk ? 'bulk-ok' : 'bulk-err')+'">'+
        ((row.modemOk && row.materialOk) ? 'Tìm Thấy' : status.map(esc).join('<br>'))+
      '</td>' +
      '</tr>';
  });

  html+='</tbody></table></div>';
  result.innerHTML=html;
}

async function getBulkDeviceInfo(serials){
  if(!serials){
    serials=parseSerialInput($('serial')?.value || '');
  }

  if(!serials.length){
    toast('Nhập Serial Number',false);
    return;
  }

  const area=$('bulkSearchArea');
  if(area)area.classList.remove('hidden');

  $('bulkSummary').innerHTML='';
  $('bulkResult').innerHTML='';
  $('bulkProgressLog').textContent='';

  const rows=[];
  setBulkProgress('Bắt đầu...',0);

  for(let i=0;i<serials.length;i++){
    const sn=serials[i];
    const row={
      serial:sn,
      menID:'',
      pppoeUsername:'',
      serialVatTu:'',
      tenVatTu:'',
      modemOk:false,
      materialOk:false,
      modemError:'',
      materialError:''
    };

    /* ---------------------------------------------------------
       1. API MODEM GỐC: giữ nguyên getDeviceInfo.
       --------------------------------------------------------- */
    try{
      setBulkProgress(
        'Đang lấy '+(i+1)+'/'+serials.length,
        Math.round((i/serials.length)*100),
        'GET getDeviceInfo → '+sn
      );

      const data=await apiGet('/getDeviceInfo',{serialNumber:sn});
      const body=data?.body;

      if(!body || typeof body!=='object'){
        throw new Error('API không có body');
      }

      row.menID=body.menID ?? '';
      row.pppoeUsername=body.pppoeUsername ?? '';
      row.modemOk=true;
    }catch(e){
      row.modemError=e?.message || String(e);
    }

    renderBulkResults(rows.concat([row]));

    /* ---------------------------------------------------------
       2. API THI CÔNG: hoàn toàn độc lập với getDeviceInfo.
       Dùng access_token lấy từ Username/Password + OTP.
       --------------------------------------------------------- */
    try{
      setBulkProgress(
        'Tra cứu vật tư '+(i+1)+'/'+serials.length,
        Math.round(((i+0.5)/serials.length)*100),
        'POST dsVatTuThiCong → '+sn
      );

      const vt=await traCuuSerialVatTu(sn);
      row.serialVatTu=vt.serialVatTu;
      row.tenVatTu=vt.tenVatTu;
      row.materialOk=!!row.serialVatTu;

      if(!row.materialOk){
        row.materialError='API thành công nhưng không có vatTuThiCong.serial';
      }
    }catch(e){
      row.materialError=e?.message || String(e);
    }

    rows.push(row);
    renderBulkResults(rows);

    const logParts=[];
    logParts.push(row.modemOk
      ? '✓ Modem '+sn+' → menID: '+(row.menID||'không có')+' | PPPoE: '+(row.pppoeUsername||'không có')
      : '✗ Modem '+sn+' → '+row.modemError);
    logParts.push(row.materialOk
      ? '✓ Vật tư '+sn+' → '+row.serialVatTu
      : '✗ Vật tư '+sn+' → '+row.materialError);

    setBulkProgress(
      'Đã xử lý '+(i+1)+'/'+serials.length,
      Math.round(((i+1)/serials.length)*100),
      logParts.join('\n')
    );

    await new Promise(function(resolve){setTimeout(resolve,100);});
  }

  const materialSuccess=rows.filter(function(x){return x.materialOk}).length;
  const modemSuccess=rows.filter(function(x){return x.modemOk}).length;

  setBulkProgress(
    '✓ Hoàn tất '+serials.length+' Serial',
    100,
    'Hoàn tất: Modem '+modemSuccess+'/'+serials.length+
    ' | Vật tư '+materialSuccess+'/'+serials.length
  );
}

async function viewFirmware(){
  $('panel').innerHTML='<h2>UPDATE FIRMWARE</h2><div class="status">Đang lấy danh sách firmware...</div>';
  progressStart('Đang lấy danh sách firmware...');
  firmwareList=[];
  try{
    progressStep('Đang đọc phiên bản hiện tại...',20);
    let info=null;
    try{
      info=await apiGet('/getDeviceInfo',{serialNumber:serial});
      firmwareCurrentVersion=info?.body?.softwareVersion || '';
      modelName=info?.body?.modelName || modelName;
    }catch(e){ firmwareCurrentVersion=''; }
    progressStep('Đang gọi getFirmwareList...',45);
    const d=await apiGet('/getFirmwareList',{modelName,serialNumber:serial});
    if(d?.errorCode!==undefined && Number(d.errorCode)!==200)
      throw new Error(d.errorMessage || 'Không lấy được danh sách firmware');
    firmwareList=Array.isArray(d?.body)?d.body:[];
    if(!firmwareList.length) throw new Error('API không trả về danh sách firmware cho model/serial này.');
    const options=firmwareList.map((f,i)=>{
      const version=f.softwareVersion || f.firmwareName || ('Firmware '+(i+1));
      const current=firmwareCurrentVersion && version===firmwareCurrentVersion ? ' — ĐANG DÙNG' : '';
      return `<option value="${i}">${esc(version+current)}${f.firmwareName && f.softwareVersion!==f.firmwareName ? ' · '+esc(f.firmwareName):''}</option>`;
    }).join('');
    $('panel').innerHTML=`
      <h2>UPDATE FIRMWARE</h2>
      <div class="status">Model: <b>${esc(modelName)}</b><br>Serial: <b>${esc(serial)}</b><br>Firmware hiện tại: <b>${esc(firmwareCurrentVersion||'Không xác định')}</b></div>
      <label>Chọn phiên bản firmware</label>
      <select id="firmwareChoice">${options}</select>
      <div id="firmwareDetail" class="status"></div>
      <button type="button" onclick="updateFirmware()">⬆️ CẬP NHẬT FIRMWARE</button>
      <button type="button" class="secondary" style="margin-top:8px" onclick="viewFirmware()">🔄 TẢI LẠI DANH SÁCH</button>
      <div class="status" style="margin-top:10px">⚠️ Không tắt nguồn modem hoặc ngắt kết nối trong quá trình cập nhật. Modem có thể tự khởi động lại. Chỉ cập nhật firmware đúng model.</div>`;
    $('firmwareChoice').addEventListener('change',renderFirmwareDetail);
    renderFirmwareDetail();
    progressDone('Đã tải '+firmwareList.length+' phiên bản firmware');
  }catch(e){
    progressError(e.message);
    $('panel').innerHTML='<h2>UPDATE FIRMWARE</h2><div class="status err">'+esc(e.message)+'</div><button onclick="viewFirmware()">Thử lại</button>';
  }
}
function renderFirmwareDetail(){
  const f=firmwareList[Number($('firmwareChoice')?.value)];
  const box=$('firmwareDetail');
  if(!f||!box)return;
  box.innerHTML='Phiên bản: <b>'+esc(f.softwareVersion||'Không rõ')+'</b><br>Tên file: '+esc(f.firmwareName||'Không rõ');
}
async function updateFirmware(){
  const select=$('firmwareChoice');
  const f=firmwareList[Number(select?.value)];
  if(!f || !f.url){toast('Firmware không có URL hợp lệ.',false);return}
  if(f.softwareVersion && f.softwareVersion===firmwareCurrentVersion){
    toast('Modem đang dùng phiên bản này.',false);return;
  }
  const version=f.softwareVersion||f.firmwareName||'đã chọn';
  if(!confirm('Xác nhận cập nhật firmware '+version+' cho modem '+serial+' ('+modelName+')?\\n\\nKhông tắt nguồn hoặc ngắt kết nối trong khi cập nhật.'))return;
  if(!beginAction())return;
  try{
    progressStart('Đang gửi lệnh cập nhật firmware...');
    progressStep('Đang gửi command updateFirm...',35);
    const result=await apiPost({
      command:'updateFirm',
      modelName,
      serialNumber:serial,
      body:{fileURL:f.url}
    });
    if(result?.errorCode!==undefined && Number(result.errorCode)!==200)
      throw new Error(result.errorMessage||'API cập nhật firmware báo lỗi');
    progressDone('API đã nhận lệnh cập nhật firmware');
    toast('Đã gửi lệnh cập nhật firmware. Chờ modem hoàn tất và kiểm tra lại phiên bản.');
    const panel=$('panel');
    if(panel){
      const notice=document.createElement('div');
      notice.className='status ok';
      notice.textContent='API trả về: '+(result?.errorMessage||'SUCCESS')+'. Đây là xác nhận nhận lệnh, chưa chứng minh modem đã cài xong firmware.';
      panel.prepend(notice);
    }
  }catch(e){
    progressError(e.message);toast('Cập nhật thất bại: '+e.message,false);
  }finally{endAction()}
}

function updateProfiles(){

  }).join('');

function fillWifiForm(){
  const band=Number($('wband')?.value||2);
  const selected=Number($('wprofile')?.value);
  const type=band===2?'Wireless 2.4G':'Wireless 5G';

  // QUAN TRỌNG:
  // Lấy đúng object đã đọc từ API và đã lưu trong wifiConfigList.
  const list=(wifiConfigList||[]).filter(v=>v.type===type);
  let x=list.find(v=>Number(v.index)===selected);

  // Một số API có thể không trả index.
  if(!x){
    const pos=list.findIndex((v,i)=>Number(v.index??(band===2?i:i+4))===selected);
    x=list[pos>=0?pos:0];
  }

  if(!x){
    $('wifiEditFields').innerHTML='<div class="status err">Không tìm thấy profile WIFI.</div>';
    return;
  }

  // Lưu đúng object gốc đang được sửa.
  window.currentWifiOriginal=x;

  $('wifiEditFields').innerHTML=`
    <div class="section-title">Cấu hình đã đọc từ API</div>
    <div class="item">
      ${row('Profile Index',x.index)}
      ${row('Băng tần',x.type)}
      ${row('Enable',bool(x.enable))}
      ${row('SSID',x.ssid)}
      ${row('Auth Mode',x.authMode)}
      ${row('Encrypt',x.encrypt)}
    </div>

    <div class="section-title">Form SET WIFI</div>

    <label>SSID</label>
    <input id="wssid" value="${esc(x.ssid??'')}">

    <label>Password</label>
    <input id="wpass" type="text" autocomplete="off" value="${esc(x.password??'')}" placeholder="Mật khẩu (có thể nhìn thấy)">

    <label>Enable</label>
    <select id="wenable">
      <option value="1" ${x.enable===true?'selected':''}>1 - True</option>
      <option value="0" ${x.enable===false?'selected':''}>0 - False</option>
    </select>

    <label>Auth Mode</label>
    <input id="wauth" value="WPAand11i">

    <label>Encrypt</label>
    <input id="wencrypt" value="AESEncryption">

    <button class="success" onclick="doSetWifi()">SET WIFI</button>`;
}

async function doSetWifi(){
  if(!beginAction()) return;
  try{
    const original=window.currentWifiOriginal;
    if(!original) throw new Error('Chưa có cấu hình WIFI đã đọc.');

    const ssid=$('wssid').value.trim();
    const authMode=$('wauth').value.trim();
    const encrypt=$('wencrypt').value.trim();

    if(!ssid) throw new Error('SSID không được để trống.');
    if(!authMode) throw new Error('Auth Mode không được để trống.');
    if(!encrypt) throw new Error('Encrypt không được để trống.');

    /*
      NGUYÊN TẮC:
      - original là cấu hình thật đã đọc từ API.
      - Không tự tạo giá trị mặc định.
      - Chỉ thay những trường người dùng sửa.
      - Các trường khác giữ nguyên theo cấu hình đã đọc.
    */
    const body=JSON.parse(JSON.stringify(original));

    body.enable=$('wenable').value==='1';
    body.ssid=ssid;
    body.authMode=authMode;
    body.encrypt=encrypt;

    if($('wpass').value){
      body.password=$('wpass').value;
    }else if(original.password!==undefined){
      // Không thay mật khẩu nếu người dùng không nhập mật khẩu mới.
      body.password=original.password;
    }

    // index phải lấy đúng từ cấu hình đã đọc.
    if(original.index!==undefined) body.index=original.index;

    const payload={
      modelName,
      serialNumber:serial,
      command:'wifiConfig',
      body
    };

    progressStart('Đang SET WIFI...');
    progressStep('Đang chuẩn bị payload WIFI từ cấu hình đã đọc...',25);
    progressStep('Đang gửi API wifiConfig...',55);
    await apiPost(payload);

    progressDone('SET WIFI thành công');
    toast('✓ SET WIFI thành công');

    // Cập nhật chính object cache bằng dữ liệu đã SET.
    Object.assign(original,body);
    fillWifiForm();

  }catch(e){
    progressError(e.message);
    toast(e.message,false);
  }finally{
    endAction();
  }
}

function wanCard(x,n){
 let r=[['WAN Index',x.wanIndex],['Enable',bool(x.enable)],['Type',x.wanType],['Connection',x.connectionType],['Name',x.wanName],['Interface',x.wanIfname],['Status',x.connectionStatus],['VLAN',x.vlanMuxID],['VLAN Priority',x.vlanPriority],['IPv4',x.externalIPAdress],['IPv4 Enable',bool(x.ipv4Enable)],['NAT',bool(x.natEnable)],['Firewall',bool(x.firewallEnable)],['Username',x.userName],['Password',x.password],['Addressing',x.addressingType],['Gateway',x.defaultGateway],['Default GW',bool(x.isDefaultGateway)],['Service',x.serviceList]];
 const has6=[x.externalIPv6Address,x.defaultIPv6Gateway,x.ipv6DnsServer,x.ipv6Status].some(v=>v!==null&&v!==undefined&&String(v).trim()!==''&&String(v)!=='0.0.0.0');
 if(has6)r.push(['IPv6',x.externalIPv6Address],['IPv6 Gateway',x.defaultIPv6Gateway],['IPv6 DNS',x.ipv6DnsServer],['IPv6 Status',x.ipv6Status]);
 return item(`WAN #${x.wanIndex??n}`,r)
}

async function doWanUpdate(){
  if(!beginAction()) return;

  try{
    const original=window.currentWanOriginal;
    if(!original) throw new Error('Chưa có cấu hình WAN đã đọc.');

    const wanIndex=numField('wi','WAN Index');
    const vlanPriority=numField('vp','VLAN Priority');
    const vlanMuxID=numField('vm','VLAN Mux ID');

    const mode=$('wanMode')?.value;
    const selectedMode=WAN_MODE_MAP[mode];
    if(!selectedMode) throw new Error('Loại WAN không hợp lệ.');
    const wanType=selectedMode.wanType;
    const connectionType=selectedMode.connectionType;
    const wanName=$('wn').value.trim();
    const userName=$('wu').value.trim();
    const addressingType=$('at').value.trim();

    if(!wanType) throw new Error('WAN Type không được để trống.');
    if(!connectionType) throw new Error('Connection Type không được để trống.');

    /*
      QUAN TRỌNG:
      Không gửi nguyên object getWanConfig().
      getWanConfig có nhiều trường chỉ để đọc trạng thái như:
      interface, connectionStatus, externalIPAdress, gateway...
      Các trường đó có thể bị API wanUpdate từ chối bằng NOK_INVALID_PARAMETER.

      wanUpdate chỉ gửi các trường thuộc FORM SỬA.
    */
    const body={
      wanIndex,
      wanType,
      connectionType,
      wanName,
      userName,
      vlanPriority,
      vlanMuxID,
      ipv4Enable:$('i4').value==='1',
      ipv6Enable:$('i6').value==='1',
      natEnable:$('nat').value==='1',
      firewallEnable:$('fw').value==='1',
      isDefaultGateway:$('dg').value==='1'
    };

    /*
      Addressing Type:
      - Có giá trị -> gửi đúng giá trị người dùng/API đã đọc.
      - Rỗng -> KHÔNG gửi field, tránh gửi "" nếu server không chấp nhận chuỗi rỗng.
    */
    if(addressingType!==''){
      body.addressingType=addressingType;
    }

    /*
      Password:
      - Textbox đang hiển thị password nếu API trả về.
      - Có password -> gửi password đó.
      - Không có password -> không tự tạo và không gửi field password.
    */
    const password=$('wp').value.trim();
    if(password!==''){
      body.password=password;
    }

    const payload={
      modelName,
      serialNumber:serial,
      command:'wanUpdate',
      body
    };

    progressStart('Đang SỬA WAN...');
    progressStep('Đang chuẩn bị payload wanUpdate...',30);
    progressStep('Đang gửi API wanUpdate...',55);

    await apiPost(payload);

    progressDone('Sửa WAN thành công');
    toast('✓ Sửa WAN thành công');

    // Cập nhật cache chỉ với các field thực sự đã gửi.
    Object.assign(original,body);
    fillWanEditForm();

  }catch(e){
    progressError(e.message);
    toast(e.message,false);
  }finally{
    endAction();
  }
}

function validIPv4(value,label){
  const s=String(value??'').trim();
  const p=s.split('.');
  if(p.length!==4 || p.some(x=>!/^\d+$/.test(x) || Number(x)>255))
    throw new Error(`${label} không hợp lệ.`);
  return s;
}

    const original=window.currentLanOriginal;
    if(!original) throw new Error('Chưa có cấu hình LAN đã đọc.');

    const ipAddress=validIPv4($('lip').value,'IP Address');
    const netMask=validIPv4($('lmask').value,'NetMask');
    const indexGroup=numField('lig','Index Group');

    const body=JSON.parse(JSON.stringify(original));
    body.enable=$('le').value==='1';
    body.ipAddress=ipAddress;
    body.netMask=netMask;
    body.indexGroup=indexGroup;

    progressStart('Đang SET LAN...');
    progressStep('Đang chuẩn bị payload LAN từ cấu hình đã đọc...',25);
    progressStep('Đang gửi API lanConfig...',55);

    await apiPost({
      modelName,
      serialNumber:serial,
      command:'lanConfig',
      body
    });

    Object.assign(original,body);

    progressDone('SET LAN thành công');
    toast('✓ SET LAN thành công');
    fillLanForm();

  }catch(e){
    progressError(e.message);
    toast(e.message,false);
  }finally{
    endAction();
  }
}

async function viewOptical(){
 $('panel').innerHTML='<h2>OPTICAL</h2><div class="status">Đang tải...</div>';
 progressStart('Đang lấy thông số OPTICAL...');
 try{progressStep('Đang gọi API getOpticalInfo...',35);
   const d=await apiGet('/getOpticalInfo',{modelName,serialNumber:serial});
   progressStep('Đang phân tích thông số quang...',80);
   const body=d?.body ?? d;

   // Hiển thị mọi tham số dạng giá trị mà API thực sự trả về,
   // không đoán tên trường Optical.
   function opticalRows(value,prefix=''){
     const rows=[];
     if(value===null || value===undefined) return rows;
     if(Array.isArray(value)){
       value.forEach((v,i)=>rows.push(...opticalRows(v,prefix?`${prefix} ${i+1}`:`${i+1}`)));
     }else if(typeof value==='object'){
       Object.entries(value).forEach(([k,v])=>{
         const label=prefix?`${prefix} / ${k}`:k;
         if(v!==null && typeof v==='object') rows.push(...opticalRows(v,label));
         else rows.push([label,v]);
       });
     }else{
       rows.push([prefix||'Kết quả',value]);
     }
     return rows;
   }

   const rows=opticalRows(body);
   $('panel').innerHTML='<h2>OPTICAL</h2>'+
     (rows.length ? item('',rows) :
      '<div class="status">API không trả về thông số Optical.</div>');
   progressDone('Đã tải OPTICAL');
 }catch(e){
   progressError(e.message);
   errorPanel(e);
 }
}

async function viewTopology(){
  $('panel').innerHTML='<h2>TOPOLOGY</h2><div class="status">Đang tải...</div>';
  progressStart('Đang lấy TOPOLOGY...');

  try{
    progressStep('Đang gọi API getTopology...',35);

    const d=await apiGet('/getDeviceConfig',{
      modelName,
      serialNumber:serial,
      command:'getTopology'
    });

    progressStep('Đang xử lý danh sách thiết bị...',80);

    /*
      Response thực tế:
      body = [
        {
          ...
          clientEntryList: [
            {
              hostName: "...",
              clientIp: "...",
              clientMac: "..."
            }
          ]
        }
      ]

      Chỉ lấy đúng 3 trường:
      hostName, clientIp, clientMac.
    */
    const nodes=Array.isArray(d?.body) ? d.body : [];
    const clients=nodes.flatMap(node =>
      Array.isArray(node?.clientEntryList) ? node.clientEntryList : []
    );

    let html='<h2>TOPOLOGY</h2>';

    if(!clients.length){
      html+='<div class="status">Không có thiết bị kết nối.</div>';
    }else{
      html+=`<div class="status ok">✓ Có ${clients.length} thiết bị kết nối.</div>`;

      clients.forEach((x,i)=>{
        html+=item(`CLIENT #${i+1}`,[
          ['Hostname',x.hostName],
          ['Client IP',x.clientIp],
          ['Client MAC',x.clientMac]
        ]);
      });
    }

    $('panel').innerHTML=html;
    progressDone(`Đã tải TOPOLOGY — ${clients.length} thiết bị`);

  }catch(e){
    progressError(e.message);
    errorPanel(e);
  }
}

function errorPanel(e){$('panel').innerHTML=`<div class="status err">✗ ${esc(e.message)}</div>`}
</script>
