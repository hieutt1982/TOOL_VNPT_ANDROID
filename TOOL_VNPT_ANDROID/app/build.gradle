plugins { id 'com.android.application' }

def appVersionCode = (project.findProperty("appVersionCode") ?: "3").toString().toInteger()
def appVersionName = (project.findProperty("appVersionName") ?: "1.1.1").toString()

android {
    namespace 'com.vnpt.tool'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vnpt.tool'
        minSdk 23
        targetSdk 28
        versionCode appVersionCode
        versionName appVersionName
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
