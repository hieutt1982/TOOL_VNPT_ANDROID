name: Build TOOL VNPT APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        working-directory: TOOL_VNPT_ANDROID
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Mỗi lần chạy Workflow mới sẽ có GITHUB_RUN_NUMBER mới.
      # Bản hiện tại là versionCode 3 / versionName 1.1.1.
      - name: Generate automatic app version
        shell: bash
        run: |
          VERSION_CODE=$((3 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.$((1 + GITHUB_RUN_NUMBER))"

          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "APK version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build debug APK
        working-directory: TOOL_VNPT_ANDROID
        run: |
          gradle --no-daemon \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" \
            assembleDebug

      - name: Generate version.json from APK
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import re
          import json
          import os

          apk = "TOOL_VNPT_ANDROID/app/build/outputs/apk/debug/app-debug.apk"
          aapt = os.path.join(
              os.environ["ANDROID_HOME"],
              "build-tools/35.0.0/aapt"
          )

          result = subprocess.check_output(
              [aapt, "dump", "badging", apk],
              text=True
          )

          match = re.search(
              r"^package:.*versionCode='([^']+)'.*versionName='([^']*)'",
              result,
              re.MULTILINE
          )

          if not match:
              raise Exception("Không đọc được phiên bản APK")

          data = {
              "versionCode": int(match.group(1)),
              "versionName": match.group(2),
              "apkFileId": "bd2681PYwhZWaJOaSSDyHLXDtNytJKTcCdmmxB",
              "description": "Cập nhật phiên bản mới",
              "forceUpdate": False
          }

          output = "TOOL_VNPT_ANDROID/version.json"

          with open(output, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Đã tạo version.json từ thông tin APK thực tế:")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          print("")
          print("LƯU Ý: Sau khi tải APK lên Google Drive, điền ID APK mới vào apkFileId.")

          with open("TOOL_VNPT_ANDROID/release-info.txt", "w", encoding="utf-8") as f:
              f.write(
                  "VERSION NAME: " + match.group(2) + "\n"
                  "VERSION CODE: " + match.group(1) + "\n"
                  "APK: app-debug.apk\\n"
                  "Sau khi upload APK lên Google Drive, cập nhật apkFileId trong version.json.\\n"
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: TOOL-VNPT-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}
          path: |
            TOOL_VNPT_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            TOOL_VNPT_ANDROID/version.json
            TOOL_VNPT_ANDROID/release-info.txt
